<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="少儿口才思维训练助手：9 大真实场景、36 个练习任务，语音识别 + 智能评估 + 家长反馈技巧，帮孩子敢说、会说、说得有条理。">
<title>少儿口才思维训练助手</title>
<style>
/* ============================================================
 * 少儿口才思维训练 · iOS 风格样式（iPhone / iPad 自适应）
 * 设计语言：系统灰底 + 白色圆角卡片 + iOS 系统色 + 毛玻璃
 * 竖屏（<768）：底部标签栏；横屏 iPad（≥1024）：左侧边栏
 * 转场：路由渐入动画 + 跨断点淡出淡入
 * ============================================================ */
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --ink: #000000;
  --secondary: rgba(60, 60, 67, .6);
  --tertiary: rgba(60, 60, 67, .3);
  --separator: rgba(60, 60, 67, .12);
  --hairline: rgba(0, 0, 0, .08);
  --tint: #007AFF;
  --tint-soft: rgba(0, 122, 255, .12);
  --green: #34C759;
  --green-soft: #E9F9EE;
  --red: #FF3B30;
  --fill: #E9E9EB;
  --fill-soft: rgba(118, 118, 128, .12);
  --glass: rgba(242, 242, 247, .78);
  --shadow-sm: 0 1px 4px rgba(0, 0, 0, .06);
  --shadow: 0 2px 12px rgba(0, 0, 0, .08);
  --shadow-lg: 0 14px 40px rgba(0, 0, 0, .16);
  --r: 18px;
  --r-sm: 12px;
  --nav-h: 50px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.55;
  font-size: 16px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

.hidden { display: none !important; }
.muted { color: var(--secondary); }

/* ============ 布局 ============ */
.app {
  max-width: 560px; margin: 0 auto;
  padding: 0 16px calc(var(--nav-h) + 66px + env(safe-area-inset-bottom));
  transition: opacity .2s ease, padding .35s ease;
}
body.layout-changing .app,
body.layout-changing .bottom-nav { opacity: 0; }

/* 路由进入动画 */
#root > * { animation: pageIn .3s cubic-bezier(.25, .8, .3, 1) both; }
@keyframes pageIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

/* ============ 顶部栏（毛玻璃） ============ */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0 8px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-logo {
  width: 38px; height: 38px; border-radius: 11px;
  background: linear-gradient(135deg, #FF9500, #FF3B30);
  display: flex; align-items: center; justify-content: center; color: #fff;
  box-shadow: 0 2px 8px rgba(255, 59, 48, .28);
}
.brand-name { font-size: 17px; font-weight: 700; letter-spacing: .2px; }
.brand-sub { font-size: 11px; color: var(--secondary); margin-top: -1px; }

.grade-pill {
  display: flex; align-items: center; gap: 6px;
  background: var(--fill-soft); border-radius: 10px;
  padding: 7px 12px; font-size: 14px; font-weight: 600;
}
.grade-pill select {
  border: none; background: none; font-weight: 700; color: var(--tint);
  outline: none; font-size: 14px; padding: 0 2px;
}

/* ============ 大标题（iOS Large Title） ============ */
.page-title {
  font-size: clamp(30px, 5vw, 34px); font-weight: 700; letter-spacing: -.5px;
  margin: 12px 2px 4px;
}

/* ============ 分组卡片 ============ */
.card {
  background: var(--card); border-radius: var(--r);
  padding: 16px; margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.card-title { font-size: 16px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.card-title .tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }

/* ============ 首页 Hero（App Store Today 卡片） ============ */
.hero {
  background: linear-gradient(135deg, #FF9500 0%, #FF3B30 100%);
  border-radius: 24px; padding: 22px 20px; color: #fff; margin-bottom: 14px;
  box-shadow: 0 10px 28px rgba(255, 59, 48, .28);
  position: relative; overflow: hidden;
}
.hero::after {
  content: ''; position: absolute; right: -36px; top: -36px; width: 140px; height: 140px;
  background: rgba(255, 255, 255, .16); border-radius: 50%;
}
.hero::before {
  content: ''; position: absolute; right: 44px; bottom: -56px; width: 112px; height: 112px;
  background: rgba(255, 255, 255, .12); border-radius: 50%;
}
.hero h1 { font-size: 24px; font-weight: 700; letter-spacing: -.3px; margin-bottom: 4px; position: relative; z-index: 1; }
.hero p { font-size: 14px; opacity: .96; position: relative; z-index: 1; }
.hero .hero-meta { display: flex; gap: 8px; margin-top: 12px; position: relative; z-index: 1; }
.hero .hero-chip {
  background: rgba(255, 255, 255, .24); border-radius: 999px; padding: 4px 12px;
  font-size: 12px; font-weight: 600;
}
.hero .cta-row { margin-top: 14px; position: relative; z-index: 1; }
.btn-cta {
  background: #fff; color: var(--red); font-weight: 700; font-size: 15px;
  border-radius: 12px; padding: 11px 18px; display: inline-flex; align-items: center; gap: 8px;
  box-shadow: 0 4px 12px rgba(0, 0, 0, .12); min-height: 44px;
}

/* ============ 场景网格（自适应列数） ============ */
.grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.cat-card {
  background: var(--card); border-radius: 18px; padding: 16px 8px 12px;
  text-align: center; cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform .18s cubic-bezier(.25, .8, .4, 1);
}
.cat-card:active { transform: scale(.96); }
.cat-icon {
  width: 48px; height: 48px; margin: 0 auto 10px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center; color: #fff;
  box-shadow: 0 4px 10px rgba(0, 0, 0, .12);
}
.cat-icon svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.cat-name { font-size: 13px; font-weight: 600; }
.cat-count { font-size: 11px; color: var(--secondary); margin-top: 2px; }

/* ============ 今日推荐 / 最近练习（iOS 列表） ============ */
.today-card { display: flex; align-items: center; gap: 14px; cursor: pointer; }
.today-badge {
  min-width: 56px; height: 56px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; text-align: center; line-height: 1.25;
}
.today-info { flex: 1; min-width: 0; }
.today-info h3 { font-size: 16px; font-weight: 600; }
.today-info p { font-size: 13px; color: var(--secondary); margin-top: 2px; }
.stars { color: #FF9F0A; font-size: 12px; letter-spacing: 1px; }
.arrow { color: var(--tertiary); font-size: 20px; font-weight: 300; }

.rec-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: .5px solid var(--separator); }
.rec-item:last-child { border-bottom: none; }
.rec-dot { width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; }
.rec-main { flex: 1; min-width: 0; }
.rec-main .t { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec-main .d { font-size: 12px; color: var(--secondary); }
.rec-score { font-weight: 700; font-size: 16px; }

.section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 20px 2px 8px; }
.section-head h2 {
  font-size: 13px; font-weight: 600; color: var(--secondary);
  text-transform: uppercase; letter-spacing: .4px;
}
.section-head .more { font-size: 13px; color: var(--tint); font-weight: 500; }
.muted.more { color: var(--secondary); }

/* ============ 场景详情 ============ */
.scene-hero {
  border-radius: 24px; padding: 22px 20px; color: #fff; margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.scene-hero h2 { font-size: 24px; font-weight: 700; letter-spacing: -.3px; }
.scene-hero p { font-size: 14px; opacity: .96; margin-top: 6px; }
.scene-hero .practice-chip {
  display: inline-block; margin-top: 12px; background: rgba(255, 255, 255, .24);
  border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 600;
}
.back-btn {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 16px; font-weight: 400; color: var(--tint);
  margin: 6px 0 10px; padding: 8px 10px 8px 2px; min-height: 40px;
}

.task-item {
  display: flex; gap: 14px; padding: 16px; border-radius: var(--r);
  background: var(--card); box-shadow: var(--shadow-sm); margin-bottom: 10px;
  cursor: pointer; transition: transform .18s cubic-bezier(.25, .8, .4, 1);
}
.task-item:active { transform: scale(.98); }
.task-num {
  width: 36px; height: 36px; border-radius: 11px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; color: #fff; font-size: 15px;
  box-shadow: 0 3px 8px rgba(0, 0, 0, .14);
}
.task-body { flex: 1; min-width: 0; }
.task-body h3 { font-size: 16px; font-weight: 600; }
.task-body .target { font-size: 13px; color: var(--secondary); margin-top: 3px; }
.task-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.task-foot .stars { font-size: 11px; }
.grade-tag {
  font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
  background: var(--tint-soft); color: var(--tint);
}

/* ============ 练习页（iPad 居中卡片弹层） ============ */
.practice-overlay {
  position: fixed; inset: 0; background: rgba(0, 0, 0, .42);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  z-index: 50; overflow-y: auto;
  padding: 0;
}
.practice-sheet {
  width: 100%; min-height: 100vh;
  background: var(--bg);
  padding: 14px 16px calc(var(--nav-h) + 34px + env(safe-area-inset-bottom));
  animation: sheetIn .34s cubic-bezier(.32, .72, 0, 1) both;
}
@keyframes sheetIn {
  from { opacity: 0; transform: translateY(26px); }
  to { opacity: 1; transform: none; }
}
@media (min-width: 768px) {
  .practice-overlay { padding: 5vh 24px; display: flex; justify-content: center; }
  .practice-sheet {
    width: 100%; max-width: 720px; min-height: 0; height: fit-content;
    border-radius: 26px; padding: 20px 20px 28px;
    box-shadow: var(--shadow-lg);
  }
}
.practice-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.practice-head .t { font-size: 16px; font-weight: 700; flex: 1; margin: 0 8px; text-align: center; }
.frame-box { background: var(--tint-soft); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.frame-box .label { font-size: 12px; font-weight: 700; color: var(--tint); margin-bottom: 4px; }
.frame-box ol { margin-left: 18px; font-size: 13.5px; color: #0040A5; }
.frame-box li { margin: 1px 0; }

.timer-box { text-align: center; padding: 20px 0 10px; }
.timer { font-size: 56px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
.timer.goal { font-size: 13px; color: var(--secondary); margin-top: -4px; }
.mic-status { font-size: 13px; font-weight: 600; margin-top: 6px; }
.mic-status.live { color: var(--red); animation: pulse 1.4s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

.ctrl-row { display: flex; gap: 10px; justify-content: center; margin: 14px 0; }

/* iOS 按钮 */
.btn {
  border-radius: 12px; padding: 12px 22px; font-size: 16px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px;
  transition: transform .14s ease, opacity .14s ease;
}
.btn:active { transform: scale(.96); }
.btn-primary { background: var(--tint); color: #fff; box-shadow: 0 3px 10px rgba(0, 122, 255, .3); }
.btn-green { background: var(--green); color: #fff; box-shadow: 0 3px 10px rgba(52, 199, 89, .3); }
.btn-ghost { background: var(--fill); color: var(--ink); }
.btn-danger { background: var(--red); color: #fff; }
.btn-lg { padding: 14px 34px; font-size: 17px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

.transcript-box { background: var(--card); border-radius: var(--r); padding: 14px; margin-top: 8px; box-shadow: var(--shadow-sm); }
.transcript-box .label { font-size: 12px; font-weight: 600; color: var(--secondary); margin-bottom: 6px; }
.transcript-text { font-size: 15px; min-height: 56px; white-space: pre-wrap; word-break: break-word; }
.transcript-text.placeholder { color: var(--tertiary); }
textarea.manual-input {
  width: 100%; border: 1.5px solid var(--separator); border-radius: 14px; padding: 12px;
  font-size: 15px; min-height: 76px; resize: vertical; outline: none; background: #fff;
}
textarea.manual-input:focus { border-color: var(--tint); }

/* 结果 */
.result-card { border-radius: 22px; padding: 20px; color: #fff; margin: 14px 0; box-shadow: var(--shadow); }
.result-level { font-size: 26px; font-weight: 700; letter-spacing: -.3px; }
.result-overall { font-size: 14px; opacity: .96; margin-top: 4px; }
.dim-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.dim-item { background: var(--card); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow-sm); }
.dim-item .name { font-size: 13px; font-weight: 600; color: var(--secondary); display: flex; justify-content: space-between; }
.dim-item .score { font-size: 20px; font-weight: 700; }
.bar { height: 6px; border-radius: 3px; background: var(--fill-soft); margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }

.radar-wrap { display: flex; justify-content: center; margin: 8px 0; }

.fb-block { background: var(--card); border-radius: var(--r); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
.fb-block h4 { font-size: 14px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.fb-block ul { list-style: none; }
.fb-block li { font-size: 14px; padding: 4px 0 4px 18px; position: relative; }
.fb-block li::before { content: '·'; position: absolute; left: 4px; font-weight: 700; color: var(--tint); }

.fw-check { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.fw-tag { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
.fw-tag.ok { background: var(--green-soft); color: #1E8E3E; }
.fw-tag.miss { background: var(--fill-soft); color: var(--secondary); }

/* ============ 训练计划 ============ */
.plan-tabs {
  display: flex; gap: 2px; background: var(--fill-soft);
  border-radius: 10px; padding: 2px; margin-bottom: 14px;
}
.plan-tabs button {
  flex: 1; border-radius: 8px; padding: 8px 0; font-size: 14px; font-weight: 600; color: var(--secondary);
  transition: all .2s ease;
}
.plan-tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .12); }

.plan-item { display: flex; gap: 14px; align-items: flex-start; }
.plan-icon {
  width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; color: #fff;
  box-shadow: 0 3px 8px rgba(0, 0, 0, .14);
}
.plan-icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.plan-body { flex: 1; }
.plan-body h3 { font-size: 16px; font-weight: 600; }
.plan-body p { font-size: 13px; color: var(--secondary); margin-top: 2px; }
.check-btn { margin-top: 10px; font-size: 14px; font-weight: 600; border-radius: 10px; padding: 8px 18px; min-height: 40px; }
.check-btn.done { background: var(--green-soft); color: #1E8E3E; }
.check-btn.undone { background: var(--tint-soft); color: var(--tint); }

.heat-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 4px; min-width: 460px; }
.heat-cell { aspect-ratio: 1; border-radius: 5px; background: #E8E8ED; }
.heat-cell[data-level="1"] { background: #FFD9A8; }
.heat-cell[data-level="2"] { background: #FFA94D; }
.heat-cell[data-level="3"] { background: #FF7A1A; }
.heat-legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--secondary); margin-top: 10px; }
.heat-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.heat-week-label { font-size: 10px; color: var(--secondary); }

.path-step { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
.path-num {
  width: 32px; height: 32px; border-radius: 16px;
  background: var(--tint-soft); color: var(--tint);
  font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.path-arrow { color: var(--separator); font-size: 18px; padding-left: 8px; }

/* ============ 我的成长 ============ */
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
.stat-box { background: var(--card); border-radius: 14px; padding: 14px 8px; text-align: center; box-shadow: var(--shadow-sm); }
.stat-box .num { font-size: 24px; font-weight: 700; color: var(--ink); letter-spacing: -.3px; }
.stat-box .lbl { font-size: 11px; color: var(--secondary); margin-top: 2px; }

.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.badge { text-align: center; background: var(--card); border-radius: 16px; padding: 14px 6px; box-shadow: var(--shadow-sm); }
.badge .ico { font-size: 28px; }
.badge .nm { font-size: 12px; font-weight: 600; margin-top: 4px; }
.badge .ds { font-size: 10.5px; color: var(--secondary); }
.badge.locked { opacity: .4; filter: grayscale(1); }

.timeline { position: relative; padding-left: 20px; }
.timeline::before { content: ''; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--separator); }
.tl-item { position: relative; padding: 0 0 16px 12px; }
.tl-item::before { content: ''; position: absolute; left: -18px; top: 8px; width: 10px; height: 10px; border-radius: 5px; background: var(--tint); }
.tl-item .t { font-size: 15px; font-weight: 600; }
.tl-item .d { font-size: 12px; color: var(--secondary); }
.tl-item .s { font-size: 13px; font-weight: 700; color: var(--tint); margin-top: 2px; }

.export-row { display: flex; gap: 10px; }

/* ============ 反馈技巧 ============ */
.tip-cat { margin-bottom: 10px; }
.tip-cat-head {
  display: flex; align-items: center; gap: 10px; padding: 15px 16px;
  border-radius: var(--r); cursor: pointer;
  box-shadow: var(--shadow-sm); background: var(--card);
}
.tip-cat-head .d { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
.tip-cat-head .tt { flex: 1; font-size: 16px; font-weight: 600; }
.tip-cat-head .it { font-size: 12px; color: var(--secondary); }
.tip-cat-head .chev { font-size: 14px; color: var(--tertiary); transition: transform .25s ease; }
.tip-cat.open .chev { transform: rotate(180deg); }
.tip-cat-body { display: none; padding: 2px 14px 14px; animation: pageIn .25s ease both; }
.tip-cat.open .tip-cat-body { display: block; }
.tip-item { background: var(--bg); border-radius: 14px; padding: 12px 14px; margin-top: 10px; }
.tip-item h5 { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
.tip-item p { font-size: 13.5px; color: var(--secondary); }

/* ============ 底部标签栏 / iPad 横屏侧边栏 ============ */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  background: rgba(249, 249, 249, .94);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-top: .5px solid var(--hairline);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  transition: opacity .2s ease;
}
.bottom-nav-inner { max-width: 620px; margin: 0 auto; display: flex; height: var(--nav-h); }
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; color: var(--tertiary); font-size: 10.5px; font-weight: 600;
}

  /* ---------------- 评估引擎 ---------------- */
  const LEVELS = [
    { min: 90, name: '表达小明星', color: '#FF9500' },
    { min: 75, name: '表达小达人', color: '#34C759' },
    { min: 60, name: '进阶中的小演说家', color: '#5AC8FA' },
    { min: 0,  name: '小步前进', color: '#8E8E93' }
  ];

  function computeAssessment(text, durationSec) {
    text = (text || '').trim();
    if (!text) return null;
    const clean = text.replace(/\s+/g, '');
    const totalChars = clean.length;
    const sentences = clean.split(/[。！？!?；;\n]+/).map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
    const minutes = Math.max(durationSec || 0, 30) / 60;
    const rate = Math.round(totalChars / minutes);
    const fillers = clean.match(/(嗯|呃|额|那个|就是|反正|就是说|然后然后|emmm|emm)/g) || [];
    const fillerRatio = totalChars ? fillers.length / totalChars : 0;
    const has = function (re) { return re.test(text); };

    const fluency = clamp(round(
      (durationSec >= 40 ? 34 : 34 * (durationSec || 0) / 40)
      + (rate >= 80 && rate <= 260 ? 40 : rate < 80 ? 22 : 26)
      + (fillerRatio <= 0.02 ? 26 : fillerRatio <= 0.05 ? 20 : fillerRatio <= 0.10 ? 14 : 7)
    ), 0, 100);

    const organization = clamp(round(
      (has(/(首先|然后|接着|后来|最后|先|再|接下来|之后|其次|最后)/) ? 22 : 0)
      + (has(/(今天|昨天|前天|刚才|早上|中午|下午|晚上|放学|周末|星期|假期|去年|今年|那时)/) ? 16 : 0)
      + (has(/(我|他|她|爸爸|妈妈|爷爷|奶奶|老师|同学|朋友|弟弟|妹妹|哥哥|姐姐|大家)/) ? 16 : 0)
      + (has(/(因为|所以|结果|于是|原因|发现|原来)/) ? 22 : 0)
      + (has(/(开心|高兴|难过|伤心|生气|害怕|兴奋|紧张|喜欢|感动|骄傲|遗憾|担心|期待)/) ? 16 : 0)
      + (has(/(总之|我觉得|我发现|我的感受|我的想法)/) ? 8 : 0)
    ), 0, 100);

    const richness = clamp(round(
      (sentences.length >= 8 ? 30 : sentences.length >= 5 ? 24 : sentences.length >= 3 ? 16 : 8)
      + (totalChars >= 150 ? 30 : totalChars >= 80 ? 22 : totalChars >= 40 ? 14 : 6)
      + (has(/(比如|例如|有一次|那时|当时|像|就像|其中|还有|另外)/) ? 20 : 0)
      + (uniqueRatio(clean) >= 0.40 ? 20 : uniqueRatio(clean) >= 0.28 ? 14 : 8)
    ), 0, 100);

    const expressive = clamp(round(
      (has(/(我认为|我觉得|我想|我的想法|我的观点|我建议)/) ? 25 : 0)
      + (has(/(因为|原因是|理由|举个例子|比如)/) ? 20 : 0)
      + (has(/(开心|高兴|难过|伤心|生气|害怕|兴奋|紧张|喜欢|感动|骄傲|遗憾|担心|期待|喜欢)/) ? 20 : 0)
      + (has(/(谢谢|请|您好|你好|对不起|抱歉|再见|辛苦了|请问|没关系|不客气)/) ? 20 : 0)
      + (has(/(为什么|怎么|什么|哪|吗|呢|能|可以)/) ? 15 : 0)
    ), 0, 100);

    const dims = { fluency: fluency, organization: organization, richness: richness, expressive: expressive };
    const overall = round(fluency * 0.25 + organization * 0.30 + richness * 0.25 + expressive * 0.20);
    let level = LEVELS[LEVELS.length - 1];
    for (let i = 0; i < LEVELS.length; i++) { if (overall >= LEVELS[i].min) { level = LEVELS[i]; break; } }

    return {
      dims: dims, overall: overall, level: level.name, levelColor: level.color,
      stats: { totalChars: totalChars, sentences: sentences.length, rate: rate, fillerCount: fillers.length, durationSec: durationSec || 0 }
    };
  }

  /* 框架要素检测：每一条支架是否在文本中出现 */
  function checkFramework(task, text) {
    const kw = {
      '时间': /(今天|昨天|前天|刚才|早上|中午|下午|晚上|放学|周末|星期|假期|去年|今年|那时|时候)/,
      '人物': /(我|他|她|爸爸|妈妈|爷爷|奶奶|老师|同学|朋友|弟弟|妹妹|哥哥|姐姐|大家|我们)/,
      '经过': /(先|然后|接着|后来|最后|再|接下来|之后)/,
      '感受': /(开心|高兴|难过|伤心|生气|害怕|兴奋|紧张|喜欢|感动|骄傲|遗憾|担心|期待|心情|觉得)/,
      '事实': /(发生|刚才|今天|昨天|先|然后|后来|最后|看见|听到|拿到|玩|去|来)/,
      '希望': /(希望|想|可以|能不能|愿意|请求|想要)/,
      '开头': /(今天|大家好|尊敬的|亲爱的|我想|我是|昨天|大家好)/,
      '中间': /(然后|接着|后来|接下来|先)/,
      '结尾': /(最后|总之|谢谢|希望大家|我觉得|我的收获|结束)/,
      '我的建议': /(我建议|我的建议|我觉得|我想|我认为)/,
      '因为': /(因为|原因是|由于)/,
      '比如': /(比如|例如|举个例子|比如说)/,
      '请问': /(请问|您好|你好|谢谢|请问)/,
      '礼貌': /(您好|你好|请问|谢谢|对不起|抱歉|再见|辛苦|请)/,
      '观点': /(我认为|我觉得|我想|我的想法|我的观点|我建议)/,
      '理由': /(因为|原因是|理由|举个例子|比如)/,
      '结果': /(结果|最后|最终|所以|发现|原来)/,
      '转折': /(突然|可是|但是|没想到|竟然|却|没想到)/,
      '步骤': /(先|然后|接着|再|最后|第一步|第二步)/,
      '困难': /(难|不会|卡住|失败|错了|困难|问题)/,
      '收获': /(收获|学会|知道|明白|发现|进步|懂了)/,
      '提问': /(问|采访|想请问|问题|为什么|怎么样)/,
      '回应': /(回应|反对|同意|认为|补充|质疑)/,
      '开场': /(大家好|尊敬的|亲爱的|各位|今天)/,
      '总结': /(总之|最后|所以|总结|希望大家|让我们一起)/,
      '结尾': /(谢谢|结束|期待|希望|再见)/,
      '心情': /(开心|高兴|难过|伤心|生气|害怕|兴奋|紧张|喜欢|期待|觉得|心情)/,
      '建议': /(建议|希望|可以|不如|试试)/
    };
    return (task.framework || []).map(function (step) {
      let found = false;
      for (const key in kw) {
        if (step.indexOf(key) >= 0 && kw[key].test(text)) { found = true; break; }
      }
      return { label: step, found: found };
    });
  }

  /* ---------------- 反馈生成 ---------------- */
  const STRENGTH_TMPL = {
    fluency: '说得很流畅，几乎没有卡壳',
    organization: '有清晰的顺序，听的人很容易跟上',
    richness: '内容很丰富，细节和例子都用上了',
    expressive: '有自己的想法和感受，还能用上礼貌用语'
  };
  const IMPROVE_TMPL = {
    fluency: '语速可以再放慢一点，把每个字说清楚；卡住时深呼吸，心里"先想后说"。',
    organization: '试试用上顺序词："首先……然后……最后……"，事情就会更有条理。',
    richness: '多加上细节：颜色、声音、味道，或者补一句"比如……"，内容会立刻丰满起来。',
    expressive: '大胆说出自己的想法和感受，用"我觉得……因为……"会更有感染力。'
  };
  const GENERIC_FOLLOWUPS = ['为什么？', '然后呢？', '你能举个例子吗？', '当时你在哪里？周围还有什么？'];

  function generateFeedback(assessment, task) {
    const d = assessment.dims;
    const strengths = [];
    const order = ['fluency', 'organization', 'richness', 'expressive'];
    order.forEach(function (k) { if (d[k] >= 75) strengths.push(STRENGTH_TMPL[k]); });

    const sorted = order.slice().sort(function (a, b) { return d[a] - d[b]; });
    const improvements = [];
    sorted.forEach(function (k) {
      if (d[k] < 72 && improvements.length < 2) improvements.push(IMPROVE_TMPL[k]);
    });
    if (!improvements.length && assessment.overall < 90) {
      improvements.push('试试把框架里的每一条都说到，你会讲得更完整。');
    }
    if (!improvements.length) {
      improvements.push('已经非常棒了！可以挑战更高星级的任务，或者试着即兴讲。');
    }

    let opener;
    if (assessment.overall >= 90) opener = '太棒了！你就是今天的"表达小明星"！';
    else if (assessment.overall >= 75) opener = '讲得真好，你已经是很棒的"表达小达人"了！';
    else if (assessment.overall >= 60) opener = '不错哦！你已经敢于完整开口，这就是最大的进步！';
    else opener = '勇敢开口就是胜利！每一次练习都会让你更厉害。';

    const followUps = (task && task.followUps && task.followUps.length)
      ? task.followUps.slice(0, 2) : GENERIC_FOLLOWUPS.slice(0, 2);

    return { opener: opener, strengths: strengths, improvements: improvements, followUps: followUps };
  }

  /* ---------------- 徽章系统 ---------------- */
  const BADGE_DEFS = [
    { id: 'first', name: '第一次开口', desc: '完成第 1 次练习', icon: '🎉' },
    { id: 'streak3', name: '坚持 3 天', desc: '连续 3 天练习', icon: '🔥' },
    { id: 'streak7', name: '坚持 7 天', desc: '连续 7 天练习', icon: '🌞' },
    { id: 'count10', name: '十次小能手', desc: '累计完成 10 次练习', icon: '💪' },
    { id: 'count30', name: '三十次达人', desc: '累计完成 30 次练习', icon: '🏅' },
    { id: 'star', name: '表达之星', desc: '单次总分达到 85+', icon: '⭐' },
    { id: 'quad', name: '四维全优', desc: '四个维度全部 80+', icon: '🌈' },
    { id: 'daily', name: '每日坚持', desc: '完成每日餐桌分享打卡', icon: '🍽️' },
    { id: 'challenge', name: '挑战者', desc: '完成一次专项挑战任务', icon: '🏆' }
  ];

  function computeBadges(records) {
    const got = [];
    const gotSet = {};
    function add(def, date) { if (!gotSet[def.id]) { gotSet[def.id] = 1; got.push({ id: def.id, name: def.name, desc: def.desc, icon: def.icon, date: date || '' }); } }

    if (records.length >= 1) add(BADGE_DEFS[0], records[records.length - 1].date);
    const streak = computeStreak(records);
    if (streak >= 3) add(BADGE_DEFS[1]);
    if (streak >= 7) add(BADGE_DEFS[2]);
    if (records.length >= 10) add(BADGE_DEFS[3]);
    if (records.length >= 30) add(BADGE_DEFS[4]);
    records.forEach(function (r) {
      if (r.overall >= 85) add(BADGE_DEFS[5], r.date);
      if (r.dims && r.dims.fluency >= 80 && r.dims.organization >= 80 && r.dims.richness >= 80 && r.dims.expressive >= 80) add(BADGE_DEFS[6], r.date);
      if (r.taskId && r.taskId.charAt(0) === 'h') add(BADGE_DEFS[8], r.date);
    });
    return got;
  }

  function computeStreak(records) {
    const days = {};
    records.forEach(function (r) { days[r.date] = 1; });
    let streak = 0;
    for (let off = 0; off < 366; off++) {
      const d = todayStr(off === 0 ? 0 : -off);
      if (days[d]) { streak++; }
      else if (off === 0) { continue; } // 今天还没练，不打断连续记录（从昨天开始算）
      else { break; }
    }
    return streak;
  }

  /* ---------------- 统计 ---------------- */
  function computeStats(records) {
    const total = records.length;
    let minutes = 0, sum = 0, sums = { fluency: 0, organization: 0, richness: 0, expressive: 0 };
    const catCount = {};
    records.forEach(function (r) {
      minutes += r.durationSec || 0;
      sum += r.overall || 0;
      ['fluency', 'organization', 'richness', 'expressive'].forEach(function (k) { sums[k] += (r.dims && r.dims[k]) || 0; });
      const c = r.cat || 'other';
      catCount[c] = (catCount[c] || 0) + 1;
    });
    const avg = function (v) { return total ? Math.round(v / total) : 0; };
    return {
      total: total,
      minutes: Math.round(minutes / 60 * 10) / 10,
      avgOverall: avg(sum),
      avgDims: { fluency: avg(sums.fluency), organization: avg(sums.organization), richness: avg(sums.richness), expressive: avg(sums.expressive) },
      catCount: catCount,
      streak: computeStreak(records)
    };
  }

  function buildHeatmap(records, days) {
    const count = {};
    records.forEach(function (r) { count[r.date] = (count[r.date] || 0) + 1; });
    const cells = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const ds = dateStrOf(d);
      const c = count[ds] || 0;
      cells.push({ date: ds, count: c, level: c === 0 ? 0 : c === 1 ? 1 : c === 2 ? 2 : 3 });
    }
    return cells;
  }

  /* ---------------- 每日推荐 ---------------- */
  function dailyRecommendation(grade) {
    const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
    const pool = TASKS.filter(function (t) { return t.grades.indexOf(grade) >= 0; });
    const list = pool.length ? pool : TASKS;
    return list[dayOfYear % list.length];
  }

  function getTask(id) {
    for (let i = 0; i < TASKS.length; i++) { if (TASKS[i].id === id) return TASKS[i]; }
    return null;
  }

  function getCategory(id) {
    for (let i = 0; i < CATEGORIES.length; i++) { if (CATEGORIES[i].id === id) return CATEGORIES[i]; }
    return null;
  }

  function taskCat(task) { return getCategory(task.cat); }

  /* ---------------- 导出 ---------------- */
  function exportPayload(profile, records, plan, tipsSeen) {
    return JSON.stringify({
      app: 'kidspeech', version: 1, exportedAt: new Date().toISOString(),
      profile: profile, records: records, plan: plan, tipsSeen: tipsSeen
    }, null, 2);
  }

  return {
    CATEGORIES: CATEGORIES,
    TASKS: TASKS,
    PLAN_TEMPLATE: PLAN_TEMPLATE,
    GRADIENT_PATH: GRADIENT_PATH,
    PREPAREDNESS: PREPAREDNESS,
    TIPS: TIPS,
    BADGE_DEFS: BADGE_DEFS,
    clamp: clamp, round: round, pad2: pad2, todayStr: todayStr, dateStrOf: dateStrOf, uid: uid, uniqueRatio: uniqueRatio,
    computeAssessment: computeAssessment,
    checkFramework: checkFramework,
    generateFeedback: generateFeedback,
    computeBadges: computeBadges,
    computeStreak: computeStreak,
    computeStats: computeStats,
    buildHeatmap: buildHeatmap,
    dailyRecommendation: dailyRecommendation,
    getTask: getTask,
    getCategory: getCategory,
    taskCat: taskCat,
    exportPayload: exportPayload
  };
});

</script>
<script>
/* ============ 少儿口才思维训练 · 界面与应用逻辑 ============ */
(function () {
  'use strict';
  const L = window.APP_LOGIC;

  /* ---------------- 小工具 ---------------- */
  const $ = function (sel) { return document.querySelector(sel); };
  const $$ = function (sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function toast(msg) {
    let t = $('#toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.classList.remove('show'); }, 2400);
  }
  function iconSvg(path, vb) {
    return '<svg viewBox="' + (vb || '0 0 24 24') + '" aria-hidden="true">' + path + '</svg>';
  }
  function starHtml(n) {
    let s = '';
    for (let i = 0; i < n; i++) s += '★';
    return '<span class="stars">' + s + '</span>';
  }
  function fmtDate(ds) {
    const t = ds.split('-');
    return t[1] + '月' + t[2] + '日';
  }
  function gradeName(g) {
    return g === 'low' ? '低年级' : g === 'mid' ? '中年级' : '高年级';
  }
  function gradeHint(g) {
    return g === 'low' ? '1–2年级' : g === 'mid' ? '3–4年级' : '5–6年级';
  }

  /* ---------------- 本地存储 ---------------- */
  const store = {
    get: function (key, def) {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
      catch (e) { return def; }
    },
    set: function (key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); return true; }
      catch (e) { toast('存储空间不足，请清理浏览器数据'); return false; }
    }
  };

  const state = {
    profile: store.get('kidspeech_profile', null),
    records: store.get('kidspeech_records', []),
    plan: store.get('kidspeech_plan', { checkins: {} }),
    grade: (store.get('kidspeech_profile') || {}).grade || 'mid',
    route: 'home',
    sceneId: null,
    practice: null
  };
  function saveRecords() { store.set('kidspeech_records', state.records); }
  function saveProfile() { state.grade = state.profile.grade; store.set('kidspeech_profile', state.profile); }
  function savePlan() { store.set('kidspeech_plan', state.plan); }

  /* ---------------- 语音识别与录音 ---------------- */
  function makeSpeechRec() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    try {
      const r = new SR();
      r.lang = 'zh-CN';
      r.continuous = true;
      r.interimResults = true;
      r.maxAlternatives = 1;
      return r;
    } catch (e) { return null; }
  }

  /* ---------------- 路由 ---------------- */
  function navigate(route, sceneId) {
    state.route = route;
    state.sceneId = sceneId || null;
    closePractice();
    render();
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  function render() {
    const nav = document.querySelector('.bottom-nav');
    if (nav) nav.innerHTML = navHtml();
    const root = $('#root');
    if (state.route === 'home') root.innerHTML = homeHtml();
    else if (state.route === 'scene') root.innerHTML = sceneHtml(state.sceneId);
    else if (state.route === 'plan') root.innerHTML = planHtml();
    else if (state.route === 'growth') root.innerHTML = growthHtml();
    else if (state.route === 'tips') root.innerHTML = tipsHtml();
    else root.innerHTML = homeHtml();
    afterRender();
  }

  /* ---------------- 首页 ---------------- */
  function homeHtml() {
    const rec = L.dailyRecommendation(state.grade);
    const cat = L.getCategory(rec.cat);
    const recent = state.records.slice(-5).reverse();
    const heroGreeting = state.profile && state.profile.name ? '嗨，' + esc(state.profile.name) + '，今天也要好好说话哦！' : '今天也要好好说话哦！';
    const recCount = state.records.length;

    const catCards = L.CATEGORIES.map(function (c) {
      const n = L.TASKS.filter(function (t) { return t.cat === c.id; }).length;
      return '<div class="cat-card" data-nav="scene" data-id="' + c.id + '" style="background:' + c.soft + ';border-color:' + c.color + '22">' +
        '<div class="cat-icon" style="background:' + c.color + '">' + iconSvg(c.icon) + '</div>' +
        '<div class="cat-name">' + c.short + '</div>' +
        '<div class="cat-count">' + n + ' 个练习</div></div>';
    }).join('');

    const recItems = recent.length ? recent.map(function (r) {
      const c = L.getCategory(r.cat);
      return '<div class="rec-item">' +
        '<span class="rec-dot" style="background:' + (c ? c.color : '#FF9500') + '"></span>' +
        '<div class="rec-main"><div class="t">' + esc(r.taskTitle) + '</div>' +
        '<div class="d">' + fmtDate(r.date) + ' · ' + Math.max(1, Math.round((r.durationSec || 0) / 60)) + ' 分钟</div></div>' +
        '<div class="rec-score" style="color:' + esc(r.levelColor || '#FF9500') + '">' + r.overall + '分</div></div>';
    }).join('') : '<div class="empty"><div class="big">🗣️</div>还没有练习记录<br>从今天的推荐开始第一次开口吧</div>';

    return '' +
      '<div class="hero">' +
        '<h1>' + heroGreeting + '</h1>' +
        '<p>9 大真实场景 · 36 个练习任务 · 有对象、有目的、有反馈、有梯度</p>' +
        '<div class="hero-meta"><span class="hero-chip">累计 ' + recCount + ' 次</span><span class="hero-chip">' + gradeName(state.grade) + '</span></div>' +
        '<div class="cta-row"><button class="btn-cta" data-act="practice" data-id="' + rec.id + '">🎯 今日练习：' + esc(rec.title) + '</button></div>' +
      '</div>' +

      '<div class="section-head"><h2>九大练习场景</h2><span class="more muted">按年级筛选任务</span></div>' +
      '<div class="grid-3">' + catCards + '</div>' +

      '<div class="section-head"><h2>今日推荐</h2></div>' +
      '<div class="card today-card" data-nav="practice" data-id="' + rec.id + '">' +
        '<div class="today-badge" style="color:' + cat.color + '">' + cat.short.replace('场景', '') + '</div>' +
        '<div class="today-info"><h3>' + esc(rec.title) + '</h3><p>' + esc(rec.target) + '</p>' + starHtml(rec.stars) + '</div>' +
        '<span class="arrow">›</span></div>' +

      '<div class="section-head"><h2>最近练习</h2></div>' +
      '<div class="card">' + recItems + '</div>';
  }

  /* ---------------- 场景详情 ---------------- */
  function sceneHtml(catId) {
    const cat = L.getCategory(catId);
    if (!cat) return homeHtml();
    const tasks = L.TASKS.filter(function (t) { return t.cat === catId && t.grades.indexOf(state.grade) >= 0; });
    const hidden = L.TASKS.length - tasks.length;
    const items = tasks.map(function (t, i) {
      return '<div class="task-item" data-nav="practice" data-id="' + t.id + '">' +
        '<div class="task-num" style="background:' + cat.color + '">' + (i + 1) + '</div>' +
        '<div class="task-body">' +
          '<h3>' + esc(t.title) + '</h3>' +
          '<div class="target">' + esc(t.target) + '</div>' +
          '<div class="task-foot">' + starHtml(t.stars) +
            '<span class="grade-tag">' + gradeName(state.grade) + '</span></div>' +
        '</div></div>';
    }).join('');

    return '' +
      '<button class="back-btn" data-nav="home">‹ 返回首页</button>' +
      '<div class="scene-hero" style="background:linear-gradient(135deg,' + cat.color + ', ' + cat.color + 'CC)">' +
        '<h2>' + cat.name + '</h2>' +
        '<p>' + esc(cat.desc) + '</p>' +
        '<span class="practice-chip">' + esc(cat.practice) + '</span></div>' +
      '<div class="card" style="font-size:13px;color:var(--muted)">当前为' + gradeName(state.grade) + '（' + gradeHint(state.grade) + '），共显示 ' + tasks.length + ' 个任务' +
        (hidden ? '，已按年级隐藏 ' + hidden + ' 个' : '') + '。切换年级可在顶部选择。</div>' +
      '<div class="section-head"><h2>练习任务</h2></div>' +
      (items || '<div class="empty">该场景暂无匹配当前年级的任务</div>');
  }

  /* ---------------- 练习页 ---------------- */
  function openPractice(taskId) {
    const task = L.getTask(taskId);
    if (!task) return;
    state.practice = {
      task: task,
      status: 'idle',
      seconds: 0,
      transcript: '',
      interim: '',
      manual: '',
      rec: null,
      chunks: [],
      audioUrl: null,
      result: null,
      resultSaved: false,
      micMode: null
    };
    renderPractice();
  }
  function closePractice() {
    if (state.practice) { stopPractice(); state.practice = null; }
    const ov = practiceEl();
    if (ov) ov.remove();
  }
  function practiceEl() { return $('#practice-overlay'); }
  function renderPractice() {
    const p = state.practice;
    if (!p) return;
    let ov = practiceEl();
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'practice-overlay';
      ov.className = 'practice-overlay';
      document.body.appendChild(ov);
    }
    const task = p.task;
    const cat = L.taskCat(task);
    ov.innerHTML = practiceHtml(p, task, cat);
    bindPractice();
    if (p.result) { try { $('#p-result').scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function fmtTime(s) {
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }
  function practiceHtml(p, task, cat) {
    const idle = p.status === 'idle';
    const running = p.status === 'running';
    const paused = p.status === 'paused';
    const ctrl = idle
      ? '<button class="btn btn-primary btn-lg" data-pact="start">🎤 开始练习</button>' +
        '<button class="btn btn-ghost btn-lg" data-pact="close">返回</button>'
      : (running
        ? '<button class="btn btn-ghost" data-pact="pause">⏸ 暂停</button>' +
          '<button class="btn btn-green" data-pact="finish">✅ 完成</button>'
        : '<button class="btn btn-primary" data-pact="resume">▶ 继续</button>' +
          '<button class="btn btn-green" data-pact="finish">✅ 完成</button>');

  function radarSvg(dims) {
    const cx = 120, cy = 108, R = 74;
    const axes = [
      { k: 'fluency', label: '流畅度' },
      { k: 'organization', label: '条理性' },
      { k: 'richness', label: '丰富度' },
      { k: 'expressive', label: '表达力' }
    ];
    function pt(i, val) {
      const a = Math.PI / 2 + (2 * Math.PI * i) / axes.length;
      return [cx + Math.cos(a) * R * (val / 100), cy - Math.sin(a) * R * (val / 100)];
    }
    let grid = '';
    for (let g = 1; g <= 4; g++) {
      const pts = axes.map(function (_, i) { return pt(i, g * 25).join(','); }).join(' ');
      grid += '<polygon points="' + pts + '" fill="rgba(255,138,61,.04)" stroke="#F1E6DA" stroke-width="1"/>';
    }
    const axesLines = axes.map(function (_, i) {
      const p = pt(i, 100);
      return '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0] + '" y2="' + p[1] + '" stroke="#F1E6DA" stroke-width="1"/>';
    }).join('');
    const dataPts = axes.map(function (a, i) { return pt(i, dims[a.k]).join(','); }).join(' ');
    const dots = axes.map(function (a, i) {
      const p = pt(i, dims[a.k]);
      return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="#FF9500"/>';
    }).join('');
    const labels = axes.map(function (a, i) {
      const p = pt(i, 118);
      return '<text x="' + p[0] + '" y="' + p[1] + '" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#3D2E22">' + a.label + '</text>';
    }).join('');
    return '<svg width="240" height="216" viewBox="0 0 240 216" aria-label="四维能力雷达图">' + grid + axesLines +
      '<polygon points="' + dataPts + '" fill="rgba(255,149,0,.28)" stroke="#FF9500" stroke-width="2" stroke-linejoin="round"/>' + dots + labels + '</svg>';
  }

  function startPractice() {
    const p = state.practice;
    if (!p) return;
    p.status = 'running';
    p.seconds = 0;
    p.transcript = '';
    p.manual = '';
    startTimer();
    requestMic().then(function (mic) {
      const p2 = state.practice;
      if (!p2 || p2.status !== 'running') { if (mic) mic.stop(); return; }
      if (mic) {
        p2.mic = mic;
        p2.micMode = 'auto';
        mic.recorder.start(1000);
        if (mic.recognition) mic.recognition.start();
      } else {
        p2.micMode = 'manual';
        p2.mic = null;
        toast('麦克风不可用，已切换为手动输入模式');
        renderPractice();
        return;
      }
      renderPractice();
    });
  }
  function requestMic() {
    return new Promise(function (resolve) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { resolve(null); return; }
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        const rec = new MediaRecorder(stream);
        const chunks = [];
        rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
        rec.onstop = function () {
          stream.getTracks().forEach(function (t) { t.stop(); });
          const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
          if (state.practice && blob.size > 0) {
            if (state.practice.audioUrl) URL.revokeObjectURL(state.practice.audioUrl);
            state.practice.audioUrl = URL.createObjectURL(blob);
          }
        };
        const sr = makeSpeechRec();
        if (sr) {
          sr.onresult = function (e) {
            const p3 = state.practice;
            if (!p3) return;
            let finalTxt = p3.transcript || '';
            let interimTxt = '';
            for (let i = e.resultIndex; i < e.results.length; i++) {
              const r = e.results[i];
              if (r.isFinal) finalTxt += r[0].transcript;
              else interimTxt += r[0].transcript;
            }
            p3.transcript = finalTxt;
            p3.interim = interimTxt;
            updateTranscriptBox();
          };
          sr.onend = function () {
            const p4 = state.practice;
            if (p4 && p4.status === 'running') {
              try { sr.start(); } catch (e) { /* 忽略 */ }
            }
          };
          sr.onerror = function () { /* 忽略错误，转写可能为空 */ };
        }
        resolve({ recorder: rec, recognition: sr });
      }).catch(function () { resolve(null); });
    });
  }
  function startTimer() {
    if (state.practice._timer) clearInterval(state.practice._timer);
    state.practice._timer = setInterval(function () {
      const p = state.practice;
      if (!p) return;
      if (p.status === 'running') {
        p.seconds++;
        const el = $('#p-timer');
        if (el) el.textContent = fmtTime(p.seconds);
        if (p.seconds === 180) toast('已达 3 分钟目标，可以完成或继续！');
      }
    }, 1000);
  }
  function updateTranscriptBox() {
    const p = state.practice;
    if (!p) return;
    const box = $('.transcript-box .transcript-text');
    if (!box) return;
    const txt = p.transcript || p.interim || '';
    if (txt) { box.textContent = txt; box.classList.remove('placeholder'); }
  }
  function pausePractice() {
    const p = state.practice;
    if (!p || p.status !== 'running') return;
    p.status = 'paused';
    if (p.mic) { try { p.mic.recorder.pause(); } catch (e) {} try { if (p.mic.recognition) p.mic.recognition.stop(); } catch (e) {} }
    renderPractice();
  }
  function resumePractice() {
    const p = state.practice;
    if (!p || p.status !== 'paused') return;
    p.status = 'running';
    if (p.mic) {
      try { p.mic.recorder.resume(); } catch (e) {}
      try { if (p.mic.recognition) p.mic.recognition.start(); } catch (e) {}
    }
    renderPractice();
  }
  function stopPractice() {
    const p = state.practice;
    if (!p) return;
    if (p._timer) { clearInterval(p._timer); p._timer = null; }
    if (p.mic) {
      try { if (p.mic.recognition) p.mic.recognition.stop(); } catch (e) {}
      try { if (p.mic.recorder.state !== 'inactive') p.mic.recorder.stop(); } catch (e) {}
      p.mic = null;
    }
    if (p.audioUrl) { URL.revokeObjectURL(p.audioUrl); p.audioUrl = null; }
  }
  function finishPractice() {
    const p = state.practice;
    if (!p) return;
    const manual = ($('#p-manual') ? $('#p-manual').value : p.manual) || '';
    const text = (p.transcript || '').trim() || manual.trim();
    if (!text) {
      toast('还没有内容哦：请对着麦克风说话，或先暂停再手动输入');
      return;
    }
    p.status = 'idle';
    stopPractice();
    const duration = Math.max(p.seconds, 20);
    const assessment = L.computeAssessment(text, duration);
    if (!assessment) { toast('请说一些内容再完成'); return; }
    assessment.text = text;
    assessment.feedback = L.generateFeedback(assessment, p.task);
    p.result = assessment;
    p.resultSaved = false;
    p.transcript = text;
    renderPractice();
    setTimeout(function () {
      const el = $('#p-result');
      if (el) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
    }, 120);
  }
  function savePracticeResult() {
    const p = state.practice;
    if (!p || !p.result || p.resultSaved) return;
    const r = p.result;
    const rec = {
      id: L.uid(),
      taskId: p.task.id,
      cat: p.task.cat,
      taskTitle: p.task.title,
      date: L.todayStr(),
      durationSec: r.durationSec || p.seconds,
      transcript: r.text,
      overall: r.overall,
      level: r.level,
      levelColor: r.levelColor,
      dims: r.dims
    };
    state.records.push(rec);
    saveRecords();
    p.resultSaved = true;
    renderPractice();
    toast('已保存到本机 ✓');
  }
  function bindPractice() {
    const ov = practiceEl();
    if (!ov || ov._bound) return;
    ov._bound = true;
    ov.addEventListener('click', function (e) {
      const el = e.target.closest('[data-pact]');
      if (!el) return;
      const act = el.getAttribute('data-pact');
      if (act === 'close') { closePractice(); render(); }
      else if (act === 'start') startPractice();
      else if (act === 'pause') pausePractice();
      else if (act === 'resume') resumePractice();
      else if (act === 'finish') finishPractice();
      else if (act === 'retry') openPractice(state.practice.task.id);
      else if (act === 'save') savePracticeResult();
      else if (act === 'replay') {
        if (state.practice && state.practice.audioUrl) {
          const a = new Audio(state.practice.audioUrl); a.play();
        } else toast('没有可回听的录音');
      }
    });
    ov.addEventListener('input', function (e) {
      if (e.target && e.target.id === 'p-manual' && state.practice) {
        state.practice.manual = e.target.value;
      }
    });
  }

  /* ---------------- 训练计划 ---------------- */
  function isoWeekKey(d) {
    const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const day = (date.getDay() + 6) % 7;
    date.setDate(date.getDate() - day + 3);
    const firstThu = new Date(date.getFullYear(), 0, 4);
    const fd = (firstThu.getDay() + 6) % 7;
    firstThu.setDate(firstThu.getDate() - fd + 3);
    const week = 1 + Math.round((date - firstThu) / (7 * 86400000));
    return date.getFullYear() + '-W' + String(week).padStart(2, '0');
  }
  function periodKey(key) {
    const d = new Date();
    if (key === 'daily') return L.todayStr();
    if (key === 'weekly') return isoWeekKey(d);
    if (key === 'monthly') return d.getFullYear() + '-' + L.pad2(d.getMonth() + 1);
    const m = d.getMonth() + 1;
    const season = (m >= 9 || m <= 1) ? '秋' : '春';
    return d.getFullYear() + '-' + season;
  }
  function isChecked(key) {
    const pk = periodKey(key);
    return !!(state.plan.checkins[pk] && state.plan.checkins[pk].indexOf(key) >= 0);
  }
  function toggleCheckin(key) {
    const pk = periodKey(key);
    if (!state.plan.checkins[pk]) state.plan.checkins[pk] = [];
    const arr = state.plan.checkins[pk];
    const i = arr.indexOf(key);
    if (i >= 0) arr.splice(i, 1); else arr.push(key);
    savePlan();
    render();
    toast(i >= 0 ? '已取消打卡' : '打卡成功，继续坚持！');
  }

        '<div class="stat-box"><div class="num">' + stats.minutes + '</div><div class="lbl">练习分钟</div></div>' +
        '<div class="stat-box"><div class="num">' + stats.streak + '</div><div class="lbl">连续天数</div></div>' +
        '<div class="stat-box"><div class="num">' + (stats.total ? stats.avgOverall : '—') + '</div><div class="lbl">平均分</div></div>' +
      '</div>' +
      '<div class="card"><div class="card-title">四维能力雷达</div>' + radarHtml + '</div>' +

      '<div class="section-head"><h2>成就徽章</h2><span class="more muted">' + badges.length + '/' + L.BADGE_DEFS.length + '</span></div>' +
      '<div class="badge-grid">' + badgeHtml + '</div>' +

      '<div class="section-head"><h2>练习历史</h2></div>' +
      '<div class="card"><div class="timeline">' + (tl || '<div class="empty">还没有记录</div>') + '</div>' +
      (state.records.length ? '<div class="export-row" style="margin-top:14px">' +
        '<button class="btn btn-ghost" data-export="json" style="flex:1;justify-content:center">⬇ 导出数据</button>' +
        '<button class="btn btn-ghost" data-export="txt" style="flex:1;justify-content:center">⬇ 成长报告</button></div>' : '') +
      '</div>' +
      '<div class="card muted" style="font-size:12px;box-shadow:none">🔒 所有数据只保存在当前设备的浏览器本地（localStorage），不上传任何服务器。换设备或清缓存会清空记录，可定期点「导出数据」备份。</div>';
  }

  function exportData(kind) {
    if (!state.records.length) { toast('还没有可导出的数据'); return; }
    let content, name;
    if (kind === 'json') {
      content = L.exportPayload(state.profile, state.records, state.plan, {});
      name = '口才训练数据备份_' + L.todayStr() + '.json';
    } else {
      const stats = L.computeStats(state.records);
      const lines = [];
      lines.push('🎤 少儿口才训练 · 成长报告');
      lines.push('生成时间：' + new Date().toLocaleString('zh-CN'));
      lines.push('年级：' + gradeName(state.grade));
      lines.push('');
      lines.push('【累计数据】');
      lines.push('练习次数：' + stats.total + ' 次');
      lines.push('练习时长：' + stats.minutes + ' 分钟');
      lines.push('连续天数：' + stats.streak + ' 天');
      lines.push('平均分：' + stats.avgOverall);
      lines.push('四维平均：流畅度 ' + stats.avgDims.fluency + ' / 条理性 ' + stats.avgDims.organization + ' / 丰富度 ' + stats.avgDims.richness + ' / 表达力 ' + stats.avgDims.expressive);
      lines.push('');
      lines.push('【练习记录】');
      state.records.slice().reverse().forEach(function (r, i) {
        lines.push((i + 1) + '. ' + r.date + ' ' + r.taskTitle + ' —— ' + r.overall + ' 分（' + r.level + '）');
      });
      content = lines.join('\n');
      name = '口才训练成长报告_' + L.todayStr() + '.txt';
    }
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
    toast('已导出：' + name);
  }

  /* ---------------- 反馈技巧 ---------------- */
  function tipsHtml() {
    const cats = L.TIPS.map(function (t) {
      const items = t.items.map(function (it) {
        return '<div class="tip-item"><h5>' + esc(it.title) + '</h5><p>' + esc(it.content) + '</p></div>';
      }).join('');
      return '<div class="tip-cat" data-tip="' + t.id + '">' +
        '<div class="tip-cat-head" style="border:1.5px solid ' + t.color + '33">' +
          '<span class="d" style="background:' + t.color + '"></span>' +
          '<span class="tt">' + t.cat + '</span>' +
          '<span class="it">' + t.items.length + ' 条</span>' +
          '<span class="chev muted">⌄</span></div>' +
        '<div class="tip-cat-body">' + items + '</div></div>';
    }).join('');
    return '' +
      '<div class="hero" style="background:linear-gradient(135deg,#58C08A,#7FD6A6)">' +
        '<h1>家长 · 老师反馈技巧</h1>' +
        '<p>多追问"为什么、然后呢、你能举个例子吗"，比简单说"你说得真好"更有效。</p>' +
        '<div class="hero-meta"><span class="hero-chip">6 大类</span><span class="hero-chip">' + L.TIPS.reduce(function (n, t) { return n + t.items.length; }, 0) + ' 条技巧</span></div></div>' +
      cats;
  }

  /* ---------------- 底部导航 ---------------- */
  const NAV = [
    { key: 'home', label: '首页', icon: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/>' },
    { key: 'plan', label: '计划', icon: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 9h18"/><path d="M9 14l2 2 4-4"/>' },
    { key: 'growth', label: '成长', icon: '<path d="M12 20V10M12 4L4 10v10M12 4l8 6v10"/><path d="M4 20h16"/>' },
    { key: 'tips', label: '技巧', icon: '<path d="M9 18h6M10 21h4"/><path d="M12 3a7 7 0 0 0-7 7c0 3 2 4 2 5h10c0-1 2-2 2-5a7 7 0 0 0-7-7z"/>' }
  ];
  function navHtml() {
    return '<div class="bottom-nav"><div class="bottom-nav-inner">' + NAV.map(function (n) {
      return '<div class="nav-item ' + (state.route === n.key ? 'on' : '') + '" data-nav="' + n.key + '">' +
        iconSvg(n.icon) + '<span>' + n.label + '</span></div>';
    }).join('') + '</div></div>';
  }

  /* ---------------- 事件绑定 ---------------- */
  function afterRender() {
    bindNav();
    bindCards();
    bindPlanTabs();
    bindTips();
    bindExports();
    bindGrade();
  }
  function bindNav() {
    $$('[data-nav]').forEach(function (el) {
      el.addEventListener('click', function () {
        const key = el.getAttribute('data-nav');
        const id = el.getAttribute('data-id');
        if (key === 'scene') navigate('scene', id);
        else if (key === 'practice') openPractice(id);
        else navigate(key);
      });
    });
  }
  function bindCards() { /* 由 bindNav 处理，无需额外逻辑 */ }
  function bindPlanTabs() {
    $$('[data-tab]').forEach(function (el) {
      el.addEventListener('click', function () {
        $$('[data-tab]').forEach(function (x) { x.classList.remove('on'); });
        el.classList.add('on');
        const key = el.getAttribute('data-tab');
        const pl = L.PLAN_TEMPLATE.filter(function (x) { return x.key === key; })[0];
        const cur = $('#plan-current');
        if (cur && pl) {
          const done = isChecked(pl.key);
          const icons = {
            sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
            book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 4.5v15z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
            video: '<rect x="2" y="6" width="13" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3"/>',
            trophy: '<path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M10 15v3M8 21h8M12 15v6"/>'
          };
          cur.innerHTML = '<div class="card plan-item">' +
            '<div class="plan-icon" style="background:' + (done ? 'var(--green)' : 'var(--primary)') + '">' + iconSvg(icons[pl.icon]) + '</div>' +
            '<div class="plan-body"><h3>' + pl.label + ' · ' + esc(pl.title) + '</h3><p>' + esc(pl.desc) + '</p>' +
            '<button class="check-btn ' + (done ? 'done' : 'undone') + '" data-plan="' + pl.key + '">' +
            (done ? '✓ 本期已完成' : '完成打卡') + '</button></div></div>';
          const btn = cur.querySelector('[data-plan]');
          if (btn) btn.addEventListener('click', function () { toggleCheckin(pl.key); });
        }
      });
    });
    $$('[data-plan]').forEach(function (el) {
      el.addEventListener('click', function () { toggleCheckin(el.getAttribute('data-plan')); });
    });
  }
  function bindTips() {
    $$('.tip-cat-head').forEach(function (el) {
      el.addEventListener('click', function () {
        const cat = el.closest('.tip-cat');
        cat.classList.toggle('open');
      });
    });
  }
  function bindExports() {
    $$('[data-export]').forEach(function (el) {
      el.addEventListener('click', function () { exportData(el.getAttribute('data-export')); });
    });
  }
  function bindGrade() {
    const sel = $('#grade-select');
    if (sel) {
      sel.value = state.grade;
      sel.addEventListener('change', function () {
        setGrade(sel.value);
      });
    }
  }
  function setGrade(g) {
    state.profile = state.profile || { createdAt: new Date().toISOString() };
    state.profile.grade = g;
    if (!state.profile.name) state.profile.name = '';
    saveProfile();
    render();
    toast('已切换到' + gradeName(g));
  }

  /* ---------------- 首次使用引导 ---------------- */
  function showGradeModal() {
    const mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.innerHTML = '<div class="modal">' +
      '<h3>👋 欢迎使用口才训练助手</h3>' +
      '<p>先告诉我孩子的年级，我会按年级推荐合适的练习任务。</p>' +
      '<div class="grade-options">' +
        '<div class="grade-opt" data-g="low"><div class="g">低</div><div class="gd">1–2 年级</div></div>' +
        '<div class="grade-opt on" data-g="mid"><div class="g">中</div><div class="gd">3–4 年级</div></div>' +
        '<div class="grade-opt" data-g="high"><div class="g">高</div><div class="gd">5–6 年级</div></div>' +
      '</div>' +
      '<div style="margin-top:14px"><input id="grade-name" placeholder="孩子的小名（可选）" style="width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;background:#FFFDF9"/></div>' +
      '<div class="modal-actions"><button class="btn btn-primary" id="grade-ok">开始使用</button></div></div>';
    document.body.appendChild(mask);
    Array.prototype.slice.call(mask.querySelectorAll('.grade-opt')).forEach(function (el) {
      el.addEventListener('click', function () {
        Array.prototype.slice.call(mask.querySelectorAll('.grade-opt')).forEach(function (x) { x.classList.remove('on'); });
        el.classList.add('on');
      });
    });
    mask.querySelector('#grade-ok').addEventListener('click', function () {
      const g = mask.querySelector('.grade-opt.on').getAttribute('data-g');
      const name = (mask.querySelector('#grade-name').value || '').trim();
      state.profile = { grade: g, name: name, createdAt: new Date().toISOString() };
      saveProfile();
      mask.remove();
      render();
      toast('欢迎！今天开始第一次练习吧');
    });
  }

  /* ---------------- 启动 ---------------- */
  function init() {
    if (!state.profile) { showGradeModal(); }
    document.body.insertAdjacentHTML('beforeend', navHtml());
    initLayoutWatcher();
    render();
  }

  /* iPad 横竖屏丝滑转场：跨断点时内容淡出再淡入，掩盖布局切换 */
  function initLayoutWatcher() {
    if (!window.matchMedia) return;
    ['(min-width: 768px)', '(min-width: 1024px)'].forEach(function (mq) {
      const m = window.matchMedia(mq);
      const onChange = function () { fadeLayout(); };
      try { m.addEventListener('change', onChange); }
      catch (e) { if (m.addListener) m.addListener(onChange); }
    });
    try { window.addEventListener('orientationchange', fadeLayout); } catch (e) {}
  }
  function fadeLayout() {
    const body = document.body;
    body.classList.remove('layout-changing');
    void body.offsetWidth;
    body.classList.add('layout-changing');
    clearTimeout(fadeLayout._t);
    fadeLayout._t = setTimeout(function () { body.classList.remove('layout-changing'); }, 260);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
</html>
